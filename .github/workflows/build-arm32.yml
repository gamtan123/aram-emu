name: Build ARAM Android Universal APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Inspect project
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== FILES ==="
          find . -maxdepth 4 -type f | sort | head -500

      - name: Find Gradle project
        run: |
          echo "=== Gradle files ==="
          find . -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" | sort

      - name: Build Android APK
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found in repository root."
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" aram-android-universal.apk

      - name: Check APK
        run: |
          echo "=== Final APK ==="
          ls -lh aram-android-universal.apk

          echo ""
          echo "=== APK libraries ==="
          unzip -l aram-android-universal.apk | grep "lib/" || true

          echo ""
          echo "=== ABI check ==="

          if unzip -l aram-android-universal.apk | grep -q "lib/armeabi-v7a/"; then
            echo "OK: armeabi-v7a is included."
          else
            echo "WARNING: armeabi-v7a is NOT included."
          fi

          if unzip -l aram-android-universal.apk | grep -q "lib/arm64-v8a/"; then
            echo "INFO: arm64-v8a is included."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aram-android-universal
          path: aram-android-universal.apk
          if-no-files-found: error
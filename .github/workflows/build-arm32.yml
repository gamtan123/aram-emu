name: Build ARAM ARM32 APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_SHA: 7f699ecd04ecc22a031905a5d15f17e2b3818843
  FRONTEND_SHA: 3f3ff549199a4593ba5a7a0e86f59d1494d9658d
  AUTHD_SHA: 4053607356dd89e621740388f7ec761e27ecee58

jobs:
  build-arm32:
    name: Build armeabi-v7a APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout aram-emu
      # ============================================================

      - name: Check out aram-emu
        uses: actions/checkout@v6
        with:
          path: aram-emu
          persist-credentials: false


      # ============================================================
      # 2. Checkout aram-core
      # ============================================================

      - name: Check out aram-core
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ env.CORE_SHA }}
          path: aram-core
          persist-credentials: false


      # ============================================================
      # 3. Checkout aram-frontend
      # ============================================================

      - name: Check out aram-frontend
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ env.FRONTEND_SHA }}
          path: aram-frontend
          persist-credentials: false


      # ============================================================
      # 4. Checkout aram-authd
      # ============================================================

      - name: Check out aram-authd
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-authd
          ref: ${{ env.AUTHD_SHA }}
          path: aram-authd
          persist-credentials: false
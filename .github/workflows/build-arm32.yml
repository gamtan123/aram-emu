name: Build ARAM Android ARM32

on:
  workflow_dispatch:

jobs:
  build-arm32:
    name: Build armeabi-v7a APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout ARAM-EMU
      # ==========================================
      - name: Checkout aram-emu
        uses: actions/checkout@v5
        with:
          path: aram-emu

      # ==========================================
      # 2. Checkout components
      # ==========================================
      - name: Checkout aram-core
        uses: actions/checkout@v5
        with:
          repository: mirusu400/aram-core
          path: aram-core

      - name: Checkout aram-frontend
        uses: actions/checkout@v5
        with:
          repository: mirusu400/aram-frontend
          path: aram-frontend

      - name: Checkout aram-authd
        uses: actions/checkout@v5
        with:
          repository: mirusu400/aram-authd
          path: aram-authd

      # ==========================================
      # 3. Go
      # ==========================================
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      # ==========================================
      # 4. Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
name: Build ARAM Android ARM32

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # APK에서 확인된 component commit
  ARAM_CORE_COMMIT: 7f699ecd04ecc22a031905a5d15f17e2b3818843
  ARAM_FRONTEND_COMMIT: 3f3ff549199a4593ba5a7a0e86f59d1494d9658d
  ARAM_AUTHD_COMMIT: 4053607356dd89e621740388f7ec761e27ecee58

  GO_VERSION: "1.26.x"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.14.1"
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:

  build-arm32:
    name: Build Android ARM32 armeabi-v7a
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. ARAM-EMU
      #
      # 중요:
      # 이전에는 존재하지 않는 88d6061... 커밋을 checkout해서
      # 여기서 빌드가 시작되기도 전에 실패했다.
      #
      # 이번에는 네 fork의 main을 사용한다.
      # ============================================================
      - name: Checkout ARAM-EMU
        uses: actions/checkout@v6
        with:
          repository: gamtan123/aram-emu
          ref: main
          path: aram-emu
          persist-credentials: false

      # ============================================================
      # 2. ARAM-CORE
      # ============================================================
      - name: Checkout ARAM-CORE
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ env.ARAM_CORE_COMMIT }}
          path: aram-core
          persist-credentials: false

      # ============================================================
      # 3. ARAM-FRONTEND
      # ============================================================
      - name: Checkout ARAM-FRONTEND
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ env.ARAM_FRONTEND_COMMIT }}
          path: aram-frontend
          persist-credentials: false

      # ============================================================
      # 4. ARAM-AUTHD
      # ============================================================
      - name: Checkout ARAM-AUTHD
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-authd
          ref: ${{ env.ARAM_AUTHD_COMMIT }}
          path: aram-authd
          persist-credentials: false

      # ============================================================
      # 5. Go
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            aram-emu/go.sum
            aram-emu/go.work.sum
            aram-core/go.sum
            aram-frontend/go.sum
            aram-authd/go.sum

      # ============================================================
      # 6. Java
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 7. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # ============================================================
      # 8. Android NDK
      # ============================================================
      - name: Install Android NDK
        shell: bash
        run: |
          set -eux

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            >> "${GITHUB_ENV}"

      # ============================================================
      # 9. Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      # ============================================================
      # 10. Show exact revisions
      # ============================================================
      - name: Show source revisions
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "ARAM-EMU"
          echo "=========================================="
          git -C aram-emu rev-parse HEAD

          echo "=========================================="
          echo "ARAM-CORE"
          echo "=========================================="
          git -C aram-core rev-parse HEAD

          echo "=========================================="
          echo "ARAM-FRONTEND"
          echo "=========================================="
          git -C aram-frontend rev-parse HEAD

          echo "=========================================="
          echo "ARAM-AUTHD"
          echo "=========================================="
          git -C aram-authd rev-parse HEAD

      # ============================================================
      # 11. ARM32 compatibility patch
      #
      # Go ARM32에서 int는 32-bit이므로
      #
      # int(^uint32(0))
      #
      # 는 4294967295를 int32로 변환하려고 해서 overflow가 발생한다.
      # ============================================================
      - name: Patch ARAM-CORE for ARM32
        shell: bash
        run: |
          set -eux

          FILE="aram-core/application/internal/ktf/ktf_state.go"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("aram-core/application/internal/ktf/ktf_state.go")
          text = path.read_text()

          old = "if len(serviceState) > int(^uint32(0)) {"
          new = "if uint64(len(serviceState)) > uint64(^uint32(0)) {"

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("ARM32 patch applied.")

          elif new in text:
              print("ARM32 patch already present.")

          else:
              print("Expected ARM32 overflow expression was not found.")

              for i, line in enumerate(text.splitlines(), 1):
                  if "serviceState" in line:
                      print(f"{i}: {line}")

              raise SystemExit(
                  "ERROR: Cannot locate ARM32 compatibility target."
              )
          PY

          echo
          echo "===== Patched code ====="

          grep -n -A4 -B4 \
            "serviceState" \
            "$FILE" \
            | head -40

      # ============================================================
      # 12. Install Ebitengine mobile binder
      #
      # 현재 aram-emu가 사용하는 Ebitengine 버전을 읽어서
      # 같은 버전의 ebitenmobile을 설치한다.
      # ============================================================
      - name: Install ebitenmobile
        working-directory: aram-emu
        shell: bash
        run: |
          set -eux

          ebiten_version="$(go list -m -f '{{.Version}}' \
            github.com/hajimehoshi/ebiten/v2)"

          echo "Ebitengine version:"
          echo "$ebiten_version"

          go install \
            "github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@${ebiten_version}"

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          ebitenmobile version || true

      # ============================================================
      # 13. Build ARM32 AAR
      #
      # 핵심:
      #
      # android/arm
      #
      # = 32-bit ARM
      # = armeabi-v7a
      # ============================================================
      - name: Build ARM32 AAR
        working-directory: aram-emu
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm
          GOARM: "7"

          CORE_SHA: ${{ env.ARAM_CORE_COMMIT }}
          FRONTEND_SHA: ${{ env.ARAM_FRONTEND_COMMIT }}

        run: |
          set -eux

          mkdir -p android/app/libs
          mkdir -p android/app/src/main/assets

          echo "=========================================="
          echo "Building ARM32 AAR"
          echo "Target: android/arm"
          echo "ABI: armeabi-v7a"
          echo "=========================================="

          ebitenmobile bind \
            -target android/arm \
            -androidapi 23 \
            -trimpath \
            -ldflags="-s -w" \
            -javapkg io.github.mirusu400.aram \
            -o android/app/libs/aram.aar \
            ./mobile

          test -s android/app/libs/aram.aar

          echo
          echo "AAR created:"
          ls -lh android/app/libs/aram.aar

      # ============================================================
      # 14. Create BUILD-INFO
      # ============================================================
      - name: Create BUILD-INFO
        working-directory: aram-emu
        shell: bash
        run: |
          set -eux

          {
            echo "aram-emu=$(git rev-parse HEAD)"
            echo "aram-core=${ARAM_CORE_COMMIT}"
            echo "aram-frontend=${ARAM_FRONTEND_COMMIT}"
            echo "aram-authd=${ARAM_AUTHD_COMMIT}"
            echo "android-abi=armeabi-v7a"
            echo "build-type=ARM32"
          } > android/app/src/main/assets/BUILD-INFO.txt

          cat android/app/src/main/assets/BUILD-INFO.txt

      # ============================================================
      # 15. Inspect AAR
      # ============================================================
      - name: Inspect ARM32 AAR
        working-directory: aram-emu
        shell: bash
        run: |
          set -eux

          echo "===== Native libraries inside AAR ====="

          unzip -l android/app/libs/aram.aar \
            | grep -E '\.so$' \
            || true

      # ============================================================
      # 16. Build ARM32 APK
      #
      # ARAM 프로젝트는 ARAM_ANDROID_ABIS 환경변수를 사용한다.
      #
      # 반드시 armeabi-v7a 하나만 넣는다.
      # ============================================================
      - name: Build ARM32 APK
        working-directory: aram-emu
        shell: bash
        env:
          ARAM_VERSION_CODE: ${{ github.run_number }}
          ARAM_VERSION_NAME: arm32-${{ github.sha }}

          ARAM_ANDROID_ABIS: armeabi-v7a

        run: |
          set -eux

          gradle \
            --no-daemon \
            --stacktrace \
            -p android \
            :app:assembleGithubDebug

      # ============================================================
      # 17. Check APK exists
      # ============================================================
      - name: Locate APK
        working-directory: aram-emu
        shell: bash
        run: |
          set -eux

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -f \
            android/app/build/outputs/apk/github/debug/app-github-debug.apk

      # ============================================================
      # 18. Verify ARM32 ABI
      #
      # 여기서 잘못된 ABI가 하나라도 들어가면 빌드 실패.
      # ============================================================
      - name: Verify ARM32 APK
        working-directory: aram-emu
        shell: bash
        run: |
          set -eux

          APK="android/app/build/outputs/apk/github/debug/app-github-debug.apk"

          echo "=========================================="
          echo "APK:"
          echo "$APK"
          echo "=========================================="

          rm -rf /tmp/aram-apk-check
          mkdir -p /tmp/aram-apk-check

          unzip -q "$APK" \
            -d /tmp/aram-apk-check

          echo
          echo "=========================================="
          echo "Native library directories"
          echo "=========================================="

          find /tmp/aram-apk-check/lib \
            -maxdepth 1 \
            -mind

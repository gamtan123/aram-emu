name: Build ARAM Android ARM32

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build armeabi-v7a APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Source
      # ============================================================

      - name: Checkout ARAM-EMU
        uses: actions/checkout@v4
        with:
          repository: gamtan123/aram-emu
          ref: main
          path: aram-emu
          fetch-depth: 1

      - name: Checkout ARAM-CORE
        uses: actions/checkout@v4
        with:
          repository: mirusu400/aram-core
          ref: main
          path: aram-core
          fetch-depth: 1

      - name: Checkout ARAM-FRONTEND
        uses: actions/checkout@v4
        with:
          repository: mirusu400/aram-frontend
          ref: main
          path: aram-frontend
          fetch-depth: 1

      - name: Checkout ARAM-AUTHD
        uses: actions/checkout@v4
        with:
          repository: mirusu400/aram-authd
          ref: main
          path: aram-authd
          fetch-depth: 1


      # ============================================================
      # 2. Go
      # ============================================================

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"


      # ============================================================
      # 3. Java
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages
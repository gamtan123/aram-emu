name: Build ARAM ARM32 APK

on:
  workflow_dispatch:

env:
  CORE_SHA: 7f699ecd04ecc22a031905a5d15f17e2b3818843
  FRONTEND_SHA: 3f3ff549199a4593ba5a7a0e86f59d1494d9658d
  AUTHD_SHA: 4053607356dd89e621740388f7ec761e27ecee58

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout aram-emu
        uses: actions/checkout@v6
        with:
          path: aram-emu

      - name: Checkout aram-core
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ env.CORE_SHA }}
          path: aram-core

      - name: Checkout aram-frontend
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ env.FRONTEND_SHA }}
          path: aram-frontend

      - name: Checkout aram-authd
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-authd
          ref: ${{ env.AUTHD_SHA }}
          path: aram-authd

      - name: Prepare sources
        run: |
          rm -rf aram-emu/aram-core
          rm -rf aram-emu/aram-frontend
          rm -rf aram-emu/aram-authd
          mv aram-core aram-emu/aram-core
          mv aram-frontend aram-emu/aram-frontend
          mv aram-authd aram-emu/aram-authd

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      - name: Patch ARM32 overflow
        working-directory: aram-emu
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("aram-core/application/internal/ktf/ktf_state.go")
          s = p.read_text()

          old = "if len(serviceState) > int(^uint32(0)) {"
          new = "if uint64(len(serviceState)) > uint64(^uint32(0)) {"

          if old in s:
              p.write_text(s.replace(old, new, 1))
              print("ARM32 patch applied")
          elif new in s:
              print("ARM32 patch already applied")
          else:
              raise SystemExit("ARM32 patch target not found")
          PY

      - name: Build ARM32 AAR
        working-directory: aram-emu
        run: |
          unset CC CXX GOOS GOARCH CGO_CFLAGS CGO_CXXFLAGS || true

          VERSION="$(go list -m -f '{{.Version}}' github.com/hajimehoshi/ebiten/v2)"

          go install \
            "github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@$VERSION"

          mkdir -p android/app/libs
          mkdir -p android/app/src/main/assets

          ebitenmobile bind \
            -target android/arm \
            -androidapi 23 \
            -trimpath \
            -javapkg io.github.mirusu400.aram \
            -o android/app/libs/aram.aar \
            ./mobile

          test -s android/app/libs/aram.aar

          unzip -l android/app/libs/aram.aar | grep "armeabi-v7a/libgojni.so"

          echo "abi=armeabi-v7a" \
            > android/app/src/main/assets/BUILD-INFO.txt

      - name: Build ARM32 APK
        working-directory: aram-emu/android
        env:
          ARAM_VERSION_CODE: ${{ github.run_number }}
          ARAM_VERSION_NAME: ARM32-${{ github.run_number }}
          ARAM_ANDROID_ABIS: armeabi-v7a
        run: |
          gradle :app:assembleGithubDebug \
            --no-daemon \
            --stacktrace

      - name: Prepare APK
        working-directory: aram-emu
        run: |
          APK="$(find android/app/build/outputs/apk -type f -name '*.apk' | head -1)"

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          mkdir -p output

          cp "$APK" \
            output/aram-android-arm32.apk

          test -s output/aram-android-arm32.apk

          unzip -l output/aram-android-arm32.apk \
            | grep "lib/armeabi-v7a/libgojni.so"

          if unzip -l output/aram-android-arm32.apk \
            | grep -Eq "lib/(arm64-v8a|x86|x86_64)/"; then
            echo "ERROR: unwanted ABI found"
            exit 1
          fi

          echo "ARM32 APK OK"
          ls -lh output/aram-android-arm32.apk

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: aram-android-arm32
          path: aram-emu/output/aram-android-arm32.apk
          if-no-files-found: error
name: Build ARAM Android ARM32

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # APK에서 확인한 정확한 커밋
  ARAM_EMU_COMMIT: 88d6061c4a739389936eae4b5bfef7ab898aa
  ARAM_CORE_COMMIT: 7f699ecd04ecc22a031905a5d15f17e2b3818843
  ARAM_FRONTEND_COMMIT: 3f3ff549199a4593ba5a7a0e86f59d1494d9658d
  ARAM_AUTHD_COMMIT: 4053607356dd89e621740388f7ec761e27ecee58

  GO_VERSION: '1.26.x'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.14.1'
  ANDROID_NDK_VERSION: '28.2.13676358'

jobs:

  build-arm32:
    name: Build Android ARM32 armeabi-v7a
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # 1. ARAM-EMU checkout
      # ------------------------------------------------------------
      - name: Checkout ARAM-EMU
        uses: actions/checkout@v4
        with:
          repository: mirusu400/aram-emu
          ref: ${{ env.ARAM_EMU_COMMIT }}
          path: aram-emu
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. ARAM-CORE
      # ------------------------------------------------------------
      - name: Checkout ARAM-CORE
        uses: actions/checkout@v4
        with:
          repository: mirusu400/aram-core
          ref: ${{ env.ARAM_CORE_COMMIT }}
          path: aram-core
          fetch-depth: 1

      # ------------------------------------------------------------
      # 3. ARAM-FRONTEND
      # ------------------------------------------------------------
      - name: Checkout ARAM-FRONTEND
        uses: actions/checkout@v4
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ env.ARAM_FRONTEND_COMMIT }}
          path: aram-frontend
          fetch-depth: 1

      # ------------------------------------------------------------
      # 4. ARAM-AUTHD
      # ------------------------------------------------------------
      - name: Checkout ARAM-AUTHD
        uses: actions/checkout@v4
        with:
          repository: mirusu400/aram-authd
          ref: ${{ env.ARAM_AUTHD_COMMIT }}
          path: aram-authd
          fetch-depth: 1

      # ------------------------------------------------------------
      # 5. Java
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ------------------------------------------------------------
      # 6. Go
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # ------------------------------------------------------------
      # 7. Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ------------------------------------------------------------
      # 8. Set Android NDK
      # ------------------------------------------------------------
      - name: Configure Android NDK
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$NDK"
          echo "ANDROID_NDK_ROOT=$NDK"

      # ------------------------------------------------------------
      # 9. Install Gradle
      # ------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ------------------------------------------------------------
      # 10. Show versions
      # ------------------------------------------------------------
      - name: Show build versions
        shell: bash
        run: |
          echo "===== Go ====="
          go version

          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version

          echo "===== NDK ====="
          "$ANDROID_NDK_HOME/ndk-build" --version || true

          echo "===== Commits ====="
          echo "aram-emu      = ${ARAM_EMU_COMMIT}"
          echo "aram-core     = ${ARAM_CORE_COMMIT}"
          echo "aram-frontend = ${ARAM_FRONTEND_COMMIT}"
          echo "aram-authd    = ${ARAM_AUTHD_COMMIT}"

      # ------------------------------------------------------------
      # 11. Prepare component directories
      # ------------------------------------------------------------
      - name: Prepare component links
        shell: bash
        working-directory: aram-emu
        run: |
          set -eux

          echo "===== aram-emu ====="
          git rev-parse HEAD

          echo "===== aram-core ====="
          cd ../aram-core
          git rev-parse HEAD

          echo "===== aram-frontend ====="
          cd ../aram-frontend
          git rev-parse HEAD

          echo "===== aram-authd ====="
          cd ../aram-authd
          git rev-parse HEAD

      # ------------------------------------------------------------
      # 12. Apply ARM32 Go compatibility fix
      #
      # ARM32에서는 Go int가 32-bit이기 때문에
      #
      # int(^uint32(0))
      #
      # 가 4294967295를 int32로 변환하려 하면서 overflow 발생.
      # ------------------------------------------------------------
      - name: Patch ARAM-CORE for 32-bit ARM
        shell: bash
        run: |
          set -eux

          FILE="aram-core/application/internal/ktf/ktf_state.go"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("aram-core/application/internal/ktf/ktf_state.go")
          text = path.read_text()

          old = "if len(serviceState) > int(^uint32(0)) {"
          new = "if uint64(len(serviceState)) > uint64(^uint32(0)) {"

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("ARM32 compatibility patch applied.")
          elif new in text:
              print("ARM32 compatibility patch already exists.")
          else:
              print("Target expression not found.")
              print("Searching nearby code...")

              for i, line in enumerate(text.splitlines(), 1):
                  if "serviceState" in line and "^uint32" in line:
                      print(f"{i}: {line}")

              raise SystemExit(
                  "ERROR: Expected ARM32 overflow expression was not found."
              )
          PY

          echo "===== Patched code ====="
          grep -n -A3 -B3 "serviceState" "$FILE" | head -30

      # ------------------------------------------------------------
      # 13. Prepare Go workspace
      # ------------------------------------------------------------
      - name: Prepare Go workspace
        shell: bash
        working-directory: aram-emu
        run: |
          set -eux

          echo "===== go.work ====="
          if [ -f go.work ]; then
            cat go.work
          fi

          echo "===== go.mod ====="
          cat go.mod

      # ------------------------------------------------------------
      # 14. Install ebitenmobile
      # ------------------------------------------------------------
      - name: Install ebitenmobile
        shell: bash
        run: |
          set -eux

          go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@latest

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          "$(go env GOPATH)/bin/ebitenmobile" version || true

      # ------------------------------------------------------------
      # 15. Build ARM32 AAR
      #
      # 핵심:
      #
      # -target android/arm
      #
      # => armeabi-v7a
      # ------------------------------------------------------------
      - name: Build ARM32 AAR
        working-directory: aram-emu
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm
          GOARM: '7'
        run: |
          set -eux

          mkdir -p android/app/libs

          ebitenmobile bind \
            -target android/arm \
            -androidapi 23 \
            -trimpath \
            -ldflags="-s -w" \
            -javapkg io.github.mirusu400.aram \
            -o android/app/libs/aram.aar \
            ./mobile

          echo "===== AAR created ====="
          ls -lh android/app/libs/aram.aar

      # ------------------------------------------------------------
      # 16. Inspect AAR
      # ------------------------------------------------------------
      - name: Inspect ARM32 AAR
        working-directory: aram-emu
        shell: bash
        run: |
          set -eux

          unzip -l android/app/libs/aram.aar | grep -E '\.so$' || true

          echo
          echo "===== AAR native libraries ====="

          unzip -l android/app/libs/aram.aar \
            | grep -E 'jni/.+\.so$' \
            || true

      # ------------------------------------------------------------
      # 17. Build ARM32 APK
      #
      # 중요:
      # ARAM 프로젝트의 Gradle ABI 설정은
      #
      # ARAM_ANDROID_ABIS
      #
      # 환경변수를 사용한다.
      # ------------------------------------------------------------
      - name: Build ARM32 APK
        working-directory: aram-emu
        shell: bash
        env:
          ARAM_VERSION_CODE: ${{ github.run_number }}
          ARAM_VERSION_NAME: arm32-${{ github.sha }}
          ARAM_ANDROID_ABIS: armeabi-v7a
        run: |
          set -eux

          gradle \
            :app:assembleGithubDebug \
            --stacktrace \
            --no-daemon

      # ------------------------------------------------------------
      # 18. Locate APK
      # ------------------------------------------------------------
      - name: Locate APK
        working-directory: aram-emu
        shell: bash
        run: |
          set -eux

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------------------
      # 19. Verify APK ABI
      # ------------------------------------------------------------
      - name: Verify ARM32 APK
        working-directory: aram-emu
        shell: bash
        run: |
          set -eux

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK=$APK"

          rm -rf /tmp/aram-apk-check
          mkdir -p /tmp/aram-apk-check

          unzip -q "$APK" -d /tmp/aram-apk-check

          echo
          echo "===== Native libraries ====="

          find /tmp/aram-apk-check/lib \
            -type f \
            -name "*.so" \
            -print \
            | sort

          echo
          echo "===== Checking armeabi-v7a ====="

          if [ ! -d "/tmp/aram-apk-check/lib/armeabi-v7a" ]; then
            echo "ERROR: armeabi-v7a directory missing"
            exit 1
          fi

          echo
          echo "===== Checking forbidden 64-bit ABIs ====="

          if [ -d "/tmp/aram-apk-check/lib/arm64-v8a" ]; then
            echo "ERROR: arm64-v8a found"
            exit 1
          fi

          if [ -d "/tmp/aram-apk-check/lib/x86_64" ]; then
            echo "ERROR: x86_64 found"
            exit 1
          fi

          if [ -d "/tmp/aram-apk-check/lib/x86" ]; then
            echo "ERROR: x86 found"
            exit 1
          fi

          echo
          echo "===== Checking every .so ====="

          SO_COUNT=0

          while IFS= read -r so; do
            SO_COUNT=$((SO_COUNT + 1))

            echo
            echo "Checking:"
            echo "$so"

            file "$so"

            if ! file "$so" | grep -Eiq "ELF 32-bit.*ARM"; then
              echo "ERROR: Not a 32-bit ARM library:"
              echo "$so"
              exit 1
            fi
          done < <(
            find /tmp/aram-apk-check/lib/armeabi-v7a \
              -type f \
              -name "*.so" \
              | sort
          )

          if [ "$SO_COUNT" -eq 0 ]; then
            echo "ERROR: No .so files found"
            exit 1
          fi

          echo
          echo "======================================"
          echo "ARM32 ABI verification PASSED"
          echo "Native libraries: $SO_COUNT"
          echo "ABI: armeabi-v7a"
          echo "No arm64-v8a"
          echo "No x86_64"
          echo "No x86"
          echo "======================================"

      # ------------------------------------------------------------
      # 20. Rename APK
      # ------------------------------------------------------------
      - name: Prepare ARM32 APK artifact
        working-directory: aram-emu
        shell: bash
        run: |
          set -eux

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" \
            android/app/build/outputs/apk/aram-android-arm32.apk

          ls -lh \
            android/app/build/outputs/apk/aram-android-arm32.apk

      # ------------------------------------------------------------
      # 21. Upload APK
      # ------------------------------------------------------------
      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: aram-android-arm32
          path: aram-emu/android/app/build/outputs/apk/aram-android-arm32.apk
          if-no-files-found: error
          retention-days: 30

name: Build ARAM Android ARM32

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. 소스 받기
      - name: Checkout ARAM-EMU
        uses: actions/checkout@v4
        with:
          repository: gamtan123/aram-emu
          path: aram-emu

      - name: Checkout ARAM-CORE
        uses: actions/checkout@v4
        with:
          repository: mirusu400/aram-core
          path: aram-core

      - name: Checkout ARAM-FRONTEND
        uses: actions/checkout@v4
        with:
          repository: mirusu400/aram-frontend
          path: aram-frontend

      - name: Checkout ARAM-AUTHD
        uses: actions/checkout@v4
        with:
          repository: mirusu400/aram-authd
          path: aram-authd

      # 2. 빌드 환경
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Set NDK
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.1"

      # 3. ARM32 호환 패치
      - name: Patch ARAM-CORE
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("aram-core/application/internal/ktf/ktf_state.go")
          s = p.read_text()

          old = "if len(serviceState) > int(^uint32(0)) {"
          new = "if uint64(len(serviceState)) > uint64(^uint32(0)) {"

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print("ARM32 patch applied.")
          elif new in s:
              print("ARM32 patch already present.")
          else:
              raise SystemExit(
                  "ARM32 patch target not found."
              )
          PY

      # 4. ARM32 C/C++ 컴파일러
      - name: Setup ARM32 compiler
        run: |
          NDK="$ANDROID_NDK_HOME"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          cat > /tmp/arm32-clang <<EOF
          #!/bin/bash
          exec "$LLVM/clang" \
            --target=armv7a-linux-androideabi23 \
            "\$@"
          EOF

          cat > /tmp/arm32-clang++ <<EOF
          #!/bin/bash
          exec "$LLVM/clang++" \
            --target=armv7a-linux-androideabi23 \
            "\$@"
          EOF

          chmod +x /tmp/arm32-clang
          chmod +x /tmp/arm32-clang++

          echo "CC=/tmp/arm32-clang" >> "$GITHUB_ENV"
          echo "CXX=/tmp/arm32-clang++" >> "$GITHUB_ENV"

      # 5. Ebitengine mobile
      - name: Install ebitenmobile
        working-directory: aram-emu
        run: |
          VERSION=$(go list -m -f '{{.Version}}' github.com/hajimehoshi/ebiten/v2)

          go install \
            github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@$VERSION

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # 6. ARM32 AAR 생성
      - name: Build ARM32 AAR
        working-directory: aram-emu
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p android/app/libs

          ebitenmobile bind \
            -target android/

name: Build ARAM Android Universal APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Show project files
        run: |
          echo "=== Project ==="
          ls -la
          echo "=== Android files ==="
          find . -maxdepth 3 -type f | sort | head -300

      - name: Make ARM32 build script executable
        run: |
          if [ -f mobile/android/build-arm32.sh ]; then
            chmod +x mobile/android/build-arm32.sh
          fi

      - name: Build ARM32 native library
        run: |
          if [ -f mobile/android/build-arm32.sh ]; then
            ./mobile/android/build-arm32.sh
          else
            echo "build-arm32.sh not found"
            exit 1
          fi

      - name: Find generated native libraries
        run: |
          echo "=== Native libraries ==="
          find . -type f \( -name "*.so" -o -name "*.aar" \) | sort || true

      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Prepare final APK
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Found APK: $APK"

          cp "$APK" aram-android-universal.apk

          echo "=== Final APK ==="
          ls -lh aram-android-universal.apk

      - name: Verify APK
        run: |
          echo "=== APK information ==="
          file aram-android-universal.apk
          unzip -l aram-android-universal.apk | grep -E 'lib/.*/.*\.so' || true

          echo ""
          echo "=== ABI check ==="

          if unzip -l aram-android-universal.apk | grep -q "lib/armeabi-v7a/"; then
            echo "OK: armeabi-v7a found"
          else
            echo "ERROR: armeabi-v7a NOT found"
            exit 1
          fi

          if unzip -l aram-android-universal.apk | grep -q "lib/arm64-v8a/"; then
            echo "INFO: arm64-v8a also included"
          else
            echo "INFO: arm64-v8a not included"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aram-android-universal
          path: aram-android-universal.apk
          if-no-files-found: error
name: Build ARAM Android ARM32

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # ============================================================
  # ARAM component versions
  #
  # 기존 APK BUILD-INFO에서 확인한 component commit
  # ============================================================

  ARAM_CORE_COMMIT: "7f699ecd04ecc22a031905a5d15f17e2b3818843"
  ARAM_FRONTEND_COMMIT: "3f3ff549199a4593ba5a7a0e86f59d1494d9658d"
  ARAM_AUTHD_COMMIT: "4053607356dd89e621740388f7ec761e27ecee58"

  GO_VERSION: "1.26.x"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.14.1"
  ANDROID_NDK_VERSION: "28.2.13676358"


jobs:

  # ============================================================
  # ARM32 Android
  # ============================================================

  build-arm32:

    name: Build Android ARM32 armeabi-v7a

    runs-on: ubuntu-24.04


    steps:

      # ==========================================================
      # 1. Checkout ARAM-EMU
      #
      # aram-emu의 이전 SHA는 공개 저장소에서 checkout되지 않아
      # main을 사용한다.
      # ==========================================================

      - name: Checkout ARAM-EMU

        uses: actions/checkout@v4

        with:
          repository: gamtan123/aram-emu
          ref: main
          path: aram-emu
          fetch-depth: 1


      # ==========================================================
      # 2. Checkout ARAM-CORE
      # ==========================================================

      - name: Checkout ARAM-CORE

        uses: actions/checkout@v4

        with:
          repository: mirusu400/aram-core
          ref: ${{ env.ARAM_CORE_COMMIT }}
          path: aram-core
          fetch-depth: 1


      # ==========================================================
      # 3. Checkout ARAM-FRONTEND
      # ==========================================================

      - name: Checkout ARAM-FRONTEND

        uses: actions/checkout@v4

        with:
          repository: mirusu400/aram-frontend
          ref: ${{ env.ARAM_FRONTEND_COMMIT }}
          path: aram-frontend
          fetch-depth: 1


      # ==========================================================
      # 4. Checkout ARAM-AUTHD
      # ==========================================================

      - name: Checkout ARAM-AUTHD

        uses: actions/checkout@v4

        with:
          repository: mirusu400/aram-authd
          ref: ${{ env.ARAM_AUTHD_COMMIT }}
          path: aram-authd
          fetch-depth: 1


      # ==========================================================
      # 5. Setup Go
      # ==========================================================

      - name: Setup Go

        uses: actions/setup-go@v5

        with:
          go-version: ${{ env.GO_VERSION }}


      # ==========================================================
      # 6. Setup Java
      # ==========================================================

      - name: Setup Java

        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ==========================================================
      # 7. Android SDK
      # ==========================================================

      - name: Setup Android SDK

        uses: android-actions/setup-android@v4

        with:
          packages: ""


      # ==========================================================
      # 8. Install Android SDK / NDK
      # ==========================================================

      - name: Install Android SDK and NDK

        shell: bash

        run: |

          set -eux

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"


      # ==========================================================
      # 9. Configure Android NDK
      # ==========================================================

      - name: Configure Android NDK

        shell: bash

        run: |

          set -eux

          NDK="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Android NDK"
          echo "=========================================="

          echo "$NDK"

          test -d "$NDK"


      # ==========================================================
      # 10. Setup Gradle
      # ==========================================================

      - name: Setup Gradle

        uses: gradle/actions/setup-gradle@v4

        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ==========================================================
      # 11. Show build information
      # ==========================================================

      - name: Show build information

        shell: bash

        run: |

          set -eux

          echo "=========================================="
          echo "Go"
          echo "=========================================="

          go version


          echo
          echo "=========================================="
          echo "Java"
          echo "=========================================="

          java -version


          echo
          echo "=========================================="
          echo "Gradle"
          echo "=========================================="

          gradle --version


          echo
          echo "=========================================="
          echo "Source revisions"
          echo "=========================================="

          echo "ARAM-EMU:"
          git -C aram-emu rev-parse HEAD

          echo
          echo "ARAM-CORE:"
          git -C aram-core rev-parse HEAD

          echo
          echo "ARAM-FRONTEND:"
          git -C aram-frontend rev-parse HEAD

          echo
          echo "ARAM-AUTHD:"
          git -C aram-authd rev-parse HEAD


      # ==========================================================
      # 12. Check Go workspace
      # ==========================================================

      - name: Check Go workspace

        working-directory: aram-emu

        shell: bash

        run: |

          set -eux

          echo "=========================================="
          echo "go.work"
          echo "=========================================="

          if [ -f go.work ]; then
            cat go.work
          fi


          echo
          echo "=========================================="
          echo "go.mod"
          echo "=========================================="

          cat go.mod


      # ==========================================================
      # 13. ARM32 compatibility patch
      #
      # ARM32에서 Go int는 32-bit이다.
      #
      # 따라서:
      #
      # int(^uint32(0))
      #
      # 는 overflow 발생.
      #
      # 이를 uint64 비교로 변경한다.
      # ==========================================================

      - name: Patch ARAM-CORE for ARM32

        shell: bash

        run: |

          set -eux

          FILE="aram-core/application/internal/ktf/ktf_state.go"

          if [ ! -f "$FILE" ]; then

            echo "ERROR:"
            echo "$FILE not found."

            exit 1

          fi


          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "aram-core/application/internal/ktf/ktf_state.go"
          )

          text = path.read_text()

          old = "if len(serviceState) > int(^uint32(0)) {"

          new = "if uint64(len(serviceState)) > uint64(^uint32(0)) {"


          if old in text:

              text = text.replace(old, new, 1)

              path.write_text(text)

              print("ARM32 compatibility patch applied.")


          elif new in text:

              print("ARM32 compatibility patch already exists.")


          else:

              print(
                  "ERROR: Expected ARM32 overflow expression "
                  "was not found."
              )

              print()
              print("Searching serviceState references:")

              for i, line in enumerate(
                  text.splitlines(),
                  1
              ):

                  if "serviceState" in line:

                      print(f"{i}: {line}")

              raise SystemExit(1)

          PY


          echo
          echo "=========================================="
          echo "Patched source"
          echo "=========================================="


          grep -n -A5 -B5 \
            "serviceState" \
            "$FILE" \
            | head -50


      # ==========================================================
      # 14. Configure Android ARM32 Clang
      #
      # 중요:
      #
      # Ubuntu 기본 gcc는 x86_64.
      #
      # ARM32 빌드에서 -marm을 받으면:
      #
      # gcc: unrecognized command-line option '-marm'
      #
      # 오류가 발생한다.
      #
      # 따라서 Android NDK clang을 사용한다.
      # ==========================================================

      - name: Configure Android ARM32 Clang

        shell: bash

        run: |

          set -eux

          NDK="$ANDROID_NDK_HOME"

          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"


          echo "=========================================="
          echo "NDK LLVM"
          echo "=========================================="

          echo "$LLVM"


          test -x "$LLVM/clang"
          test -x "$LLVM/clang++"


          echo
          echo "=========================================="
          echo "Clang version"
          echo "=========================================="


          "$LLVM/clang" --version


          # ------------------------------------------------------
          # ARM32 C compiler wrapper
          # ------------------------------------------------------

          cat > /tmp/aram-arm32-clang <<EOF
#!/bin/bash

exec "$LLVM/clang" \
  --target=armv7a-linux-androideabi23 \
  "\$@"
EOF


          # ------------------------------------------------------
          # ARM32 C++ compiler wrapper
          # ------------------------------------------------------

          cat > /tmp/aram-arm32-clang++ <<EOF
#!/bin/bash

exec "$LLVM/clang++" \
  --target=armv7a-linux-androideabi23 \
  "\$@"
EOF


          chmod +x /tmp/aram-arm32-clang
          chmod +x /tmp/aram-arm32-clang++


          echo "CC=/tmp/aram-arm32-clang" \
            >> "$GITHUB_ENV"

          echo "CXX=/tmp/aram-arm32-clang++" \
            >> "$GITHUB_ENV"


          echo
          echo "=========================================="
          echo "Testing ARM32 compiler"
          echo "=========================================="


          cat > /tmp/test-arm32.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF


          /tmp/aram-arm32-clang \
            -marm \
            /tmp/test-arm32.c \
            -o /tmp/test-arm32


          file /tmp/test-arm32


          echo
          echo "ARM32 compiler test PASSED."


      # ==========================================================
      # 15. Install ebitenmobile
      #
      # 주의:
      #
      # 여기서는 GOARCH=arm을 설정하지 않는다.
      #
      # ebitenmobile/gomobile 자체는 GitHub runner의
      # x86_64에서 실행되어야 한다.
      # ==========================================================

      - name: Install ebitenmobile

        working-directory: aram-emu

        shell: bash

        run: |

          set -eux


          EBitenVersion="$(
            go list -m -f '{{.Version}}' \
              github.com/hajimehoshi/ebiten/v2
          )"


          echo "=========================================="
          echo "Ebitengine version"
          echo "=========================================="

          echo "$EBitenVersion"


          go install \
            "github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@${EBitenVersion}"


          echo "$(go env GOPATH)/bin" \
            >> "$GITHUB_PATH"


          echo
          echo "=========================================="
          echo "ebitenmobile"
          echo "=========================================="


          ebitenmobile version || true


      # ==========================================================
      # 16. Build ARM32 AAR
      #
      # 매우 중요:
      #
      # GOARCH=arm을 직접 지정하지 않는다.
      #
      # ARM32 대상은 ebitenmobile의:
      #
      #     -target android/arm
      #
      # 로 지정한다.
      #
      # 이렇게 해야 gomobile 자체가 ARM32 executable로
      # 만들어지는 문제를 방지할 수 있다.
      # ==========================================================

      - name: Build ARM32 AAR

        working-directory: aram-emu

        shell: bash

        env:

          CGO_ENABLED: "1"

        run: |

          set -eux


          mkdir -p android/app/libs

          mkdir -p android/app/src/main/assets


          echo "=========================================="
          echo "Building ARM32 AAR"
          echo "=========================================="


          echo "Host OS:"
          go env GOHOSTOS


          echo
          echo "Host architecture:"
          go env GOHOSTARCH


          echo
          echo "Compiler:"
          echo "$CC"


          echo
          echo "C++ compiler:"
          echo "$CXX"


          echo
          echo "Android target:"
          echo "android/arm"


          echo
          echo "Android ABI:"
          echo "armeabi-v7a"


          echo
          echo "=========================================="
          echo "ebitenmobile bind"
          echo "=========================================="


          ebitenmobile bind \
            -target android/arm \
            -androidapi 23 \
            -trimpath \
            -ldflags="-s -w" \
            -javapkg io.github.mirusu400.aram \
            -o android/app/libs/aram.aar \
            ./mobile


          test -s android/app/libs/aram.aar


          echo
          echo "=========================================="
          echo "AAR created successfully"
          echo "=========================================="


          ls -lh \
            android/app/libs/aram.aar


      # ==========================================================
      # 17. Inspect AAR
      # ==========================================================

      - name: Inspect ARM32 AAR

        working-directory: aram-emu

        shell: bash

        run: |

          set -eux


          echo "=========================================="
          echo "Native libraries inside AAR"
          echo "=========================================="


          unzip -l \
            android/app/libs/aram.aar \
            | grep -E '\.so$' \
            || true


      # ==========================================================
      # 18. Create BUILD-INFO
      # ==========================================================

      - name: Create BUILD-INFO

        working-directory: aram-emu

        shell: bash

        run: |

          set -eux


          mkdir -p \
            android/app/src/main/assets


          cat > android/app/src/main/assets/BUILD-INFO.txt <<EOF
aram-emu=$(git rev-parse HEAD)
aram-core=${ARAM_CORE_COMMIT}
aram-frontend=${ARAM_FRONTEND_COMMIT}
aram-authd=${ARAM_AUTHD_COMMIT}
android-abi=armeabi-v7a
build-type=ARM32
EOF


          echo "=========================================="
          echo "BUILD-INFO"
          echo "=========================================="


          cat \
            android/app/src/main/assets/BUILD-INFO.txt


      # ==========================================================
      # 19. Build ARM32 APK
      #
      # ARAM_ANDROID_ABIS를 반드시 armeabi-v7a로 제한.
      # ==========================================================

      - name: Build ARM32 APK

        working-directory: aram-emu

        shell: bash

        env:

          ARAM_VERSION_CODE: ${{ github.run_number }}

          ARAM_VERSION_NAME: "arm32-${{ github.sha }}"

          ARAM_ANDROID_ABIS: "armeabi-v7a"

        run: |

          set -eux


          echo "=========================================="
          echo "Building ARM32 APK"
          echo "=========================================="


          echo "ARAM_ANDROID_ABIS:"
          echo "$ARAM_ANDROID_ABIS"


          gradle \
            --no-daemon \
            --stacktrace \
            -p android \
            :app:assembleGithubDebug


      # ==========================================================
      # 20. Locate APK
      # ==========================================================

      - name: Locate APK

        working-directory: aram-emu

        shell: bash

        run: |

          set -eux


          echo "=========================================="
          echo "APK files"
          echo "=========================================="


          find \
            android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================================
      # 21. Verify ARM32 APK
      #
      # APK에:
      #
      # armeabi-v7a
      #
      # 만 존재해야 한다.
      #
      # arm64-v8a
      # x86_64
      # x86
      #
      # 가 존재하면 빌드 실패.
      # ==========================================================

      - name: Verify ARM32 APK

        working-directory: aram-emu

        shell: bash

        run: |

          set -eux


          APK="$(
            find \
              android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"


          if [ -z "$APK" ]; then

            echo "ERROR: APK not found."

            exit 1

          fi


          echo "APK:"
          echo "$APK"


          rm -rf \
            /tmp/aram-apk-check


          mkdir -p \
            /tmp/aram-apk-check


          unzip -q \
            "$APK" \
            -d /tmp/aram-apk-check


          echo
          echo "=========================================="
          echo "ABI directories"
          echo "=========================================="


          if [ ! -d "/tmp/aram-apk-check/lib" ]; then

            echo "ERROR:"
            echo "APK has no lib directory."

            exit 1

          fi


          find \
            /tmp/aram-apk-check/lib \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -print \
            | sort


          # ------------------------------------------------------
          # armeabi-v7a 확인
          # ------------------------------------------------------

          if [ ! -d \
            "/tmp/aram-apk-check/lib/armeabi-v7a" ]; then

            echo
            echo "ERROR:"
            echo "armeabi-v7a is missing."

            exit 1

          fi


          # ------------------------------------------------------
          # arm64-v8a 금지
          # ------------------------------------------------------

          if [ -d \
            "/tmp/aram-apk-check/lib/arm64-v8a" ]; then

            echo
            echo "ERROR:"
            echo "arm64-v8a detected."

            exit 1

          fi


          # ------------------------------------------------------
          # x86_64 금지
          # ------------------------------------------------------

          if [ -d \
            "/tmp/aram-apk-check/lib/x86_64" ]; then

            echo
            echo "ERROR:"
            echo "x86_64 detected."

            exit 1

          fi


          # ------------------------------------------------------
          # x86 금지
          # ------------------------------------------------------

          if [ -d \
            "/tmp/aram-apk-check/lib/x86" ]; then

            echo
            echo "ERROR:"
            echo "x86 detected."

            exit 1

          fi


          echo
          echo "=========================================="
          echo "All native libraries"
          echo "=========================================="


          find \
            /tmp/aram-apk-check/lib \
            -type f \
            -name "*.so" \
            -print \
            | sort


          echo
          echo "=========================================="
          echo "Checking every .so"
          echo "=========================================="


          SO_COUNT=0


          while IFS= read -r SO_FILE; do

            SO_COUNT=$((SO_COUNT + 1))


            echo
            echo "------------------------------------------"

            echo "Library:"
            echo "$SO_FILE"

            echo "------------------------------------------"


            file "$SO_FILE"


            if ! file "$SO_FILE" \
              | grep -Eiq "ELF 32-bit.*ARM"; then

              echo
              echo "ERROR:"
              echo "This is not an ARM32 library."

              echo "$SO_FILE"

              exit 1

            fi

          done < <(

            find \
              /tmp/aram-apk-check/lib/armeabi-v7a \
              -type f \
              -name "*.so" \
              | sort

          )


          if [ "$SO_COUNT" -eq 0 ]; then

            echo
            echo "ERROR:"
            echo "No native .so files found."

            exit 1

          fi


          echo
          echo "=========================================="
          echo "ARM32 ABI CHECK PASSED"
          echo "=========================================="


          echo "ABI: armeabi-v7a"

          echo "Native library count: $SO_COUNT"

          echo "arm64-v8a: NOT PRESENT"

          echo "x86_64: NOT PRESENT"

          echo "x86: NOT PRESENT"


          echo "=========================================="


      # ==========================================================
      # 22. Verify BUILD-INFO inside APK
      # ==========================================================

      - name: Verify BUILD-INFO

        working-directory: aram-emu

        shell: bash

        run: |

          set -eux


          APK="$(
            find \
              android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"


          echo "=========================================="
          echo "BUILD-INFO inside APK"
          echo "=========================================="


          unzip -p \
            "$APK" \
            assets/BUILD-INFO.txt \
            || true


      # ==========================================================
      # 23. Prepare final APK
      # ==========================================================

      - name: Prepare ARM32 APK

        working-directory: aram-emu

        shell: bash

        run: |

          set -eux


          mkdir -p dist


          APK="$(
            find \
              android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"


          if [ -z "$APK" ]; then

            echo "ERROR: APK not found."

            exit 1

          fi


          cp \
            "$APK" \
            dist/aram-android-arm32.apk


          echo
          echo "=========================================="
          echo "Final ARM32 APK"
          echo "=========================================="


          ls -lh \
            dist/aram-android-arm32.apk


      # ==========================================================
      # 24. Upload Artifact
      # ==========================================================

      - name: Upload ARM32 APK

        uses: actions/upload-artifact@v4

        with:

          name: aram-android-arm32

          path: aram-emu/dist/aram-android-arm32.apk

          if-no-files-found: error

          retention-days: 30
